x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
    args:
      MIRA_CHANNELS: ${MIRA_CHANNELS:-whatsapp}
  volumes:
    - ~/.mira:/home/mira/.mira
  cap_drop:
    - ALL

services:
  mira-gateway:
    container_name: mira-gateway
    <<: *common-config
    command: ["gateway"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:18790:18790
      - 8765:8765
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  mira-api:
    container_name: mira-api
    <<: *common-config
    command:
      ["serve", "--host", "0.0.0.0", "-w", "/home/mira/.mira/api-workspace"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:8900:8900
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  mira-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true
