<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Mira workbench UI — operate your execution workspace."
      data-i18n-meta="description"
    />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/brand/mira_mark.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/brand/mira_favicon_32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/mira_apple_touch.png" />
    <style>
      html,
      body,
      #root {
        height: 100%;
      }

      body {
        margin: 0;
        background: #ffffff;
        color: #0a0a0a;
        font-family:
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", "Noto Sans SC",
          "Noto Sans CJK SC", "Noto Sans TC", "Noto Sans CJK TC",
          "PingFang SC", "PingFang TC", "Hiragino Sans GB",
          "Heiti SC", "Heiti TC", "Microsoft YaHei", "Microsoft JhengHei",
          sans-serif;
      }

      html.dark body {
        background: #1a1a1a;
        color: #fafafa;
      }

      .boot-splash {
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: center;
      }

      .boot-splash-inner {
        display: flex;
        align-items: center;
        gap: 10px;
        color: rgba(255, 255, 255, 0.74);
        font-size: 14px;
      }

      html:not(.dark) .boot-splash-inner {
        color: rgba(10, 10, 10, 0.64);
      }

      .boot-dot {
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        background: currentColor;
        opacity: 0.75;
        animation: boot-pulse 1s ease-in-out infinite;
      }

      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(0.9);
          opacity: 0.45;
        }
        50% {
          transform: scale(1);
          opacity: 0.85;
        }
      }
    </style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("mira-webui.theme");
          var dark =
            stored === "dark" ||
            (!stored &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch {}
      })();
    </script>
    <title>Mira</title>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root">
      <div class="boot-splash">
        <div class="boot-splash-inner">
          <span class="boot-dot" aria-hidden="true"></span>
          <span data-boot-copy>Loading mira…</span>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var localeKey = "mira.locale";
        var copy = {
          en: {
            boot: "Loading Mira…",
            description: "Mira workbench UI — operate your execution workspace."
          },
          "zh-CN": {
            boot: "正在加载 Mira…",
            description: "Mira 工作台 UI —— 操作你的执行工作区。"
          },
          "zh-TW": {
            boot: "正在載入 mira…",
            description: "mira 工作台 UI —— 操作你的 mira 執行工作區。"
          },
          fr: {
            boot: "Chargement de mira…",
            description: "Interface web mira — discutez avec votre espace de travail mira."
          },
          ja: {
            boot: "mira を読み込み中…",
            description: "mira Web UI — mira ワークスペースと会話します。"
          },
          ko: {
            boot: "mira 불러오는 중…",
            description: "mira 웹 UI — mira 작업공간과 대화하세요."
          },
          es: {
            boot: "Cargando mira…",
            description: "Interfaz web de mira: conversa con tu espacio de trabajo de mira."
          },
          "pt-BR": {
            boot: "Carregando mira…",
            description: "Interface web do mira — converse com o seu workspace do mira."
          },
          vi: {
            boot: "Đang tải mira…",
            description: "Giao diện web mira — trò chuyện với workspace mira của bạn."
          },
          id: {
            boot: "Memuat mira…",
            description: "UI web mira — ngobrol dengan workspace mira Anda."
          }
        };

        function normalizeLocale(input) {
          if (!input) return "en";
          var raw = String(input).trim();
          if (!raw) return "en";
          if (copy[raw]) return raw;
          var lower = raw.toLowerCase();
          if (lower === "zh" || lower.indexOf("zh-cn") === 0 || lower.indexOf("zh-sg") === 0) {
            return "zh-CN";
          }
          if (
            lower.indexOf("zh-tw") === 0 ||
            lower.indexOf("zh-hk") === 0 ||
            lower.indexOf("zh-mo") === 0 ||
            lower.indexOf("zh-hant") === 0
          ) {
            return "zh-TW";
          }
          if (lower === "pt" || lower.indexOf("pt-") === 0) {
            return "pt-BR";
          }
          var base = lower.split("-")[0];
          return copy[base] ? base : "en";
        }

        try {
          var stored = localStorage.getItem(localeKey);
          var detected =
            stored ||
            (navigator.languages && navigator.languages[0]) ||
            navigator.language ||
            "en";
          var locale = normalizeLocale(detected);
          var localized = copy[locale] || copy.en;
          document.documentElement.lang = locale;
          var description = document.querySelector('[data-i18n-meta=\"description\"]');
          if (description) description.setAttribute("content", localized.description);
          var boot = document.querySelector("[data-boot-copy]");
          if (boot) boot.textContent = localized.boot;
        } catch {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
