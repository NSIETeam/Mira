name: Benchmarks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - mira/agent/**
      - mira/kernel/**
      - tests/benchmarks/**
      - .github/workflows/benchmarks.yml

permissions:
  contents: read

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run lightweight benchmark guards
        run: |
          set -o pipefail
          uv run --no-sync python -m pytest tests/benchmarks -q --durations=0 | tee benchmark-output.txt
          {
            echo "## Benchmark Guards"
            echo
            echo "The benchmark suite fails when a guarded hot path exceeds its calibrated threshold."
            echo
            echo '```'
            cat benchmark-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark output
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-output
          path: benchmark-output.txt
          if-no-files-found: error
