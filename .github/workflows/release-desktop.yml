name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Derive release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(python - <<'PY'
import tomllib
from pathlib import Path
print(tomllib.loads(Path('pyproject.toml').read_text())['project']['version'])
PY
)"
          fi
          echo "MIRA_RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Set up Rust native boundary tools
        uses: dtolnay/rust-toolchain@stable

      - name: Build native diagnostics
        shell: bash
        run: |
          cargo build --release --manifest-path native/mira-launcher/Cargo.toml
          cargo build --release --manifest-path native/mira-sandbox/Cargo.toml
          cargo build --release --manifest-path native/mira-pack/Cargo.toml

      - name: Stage native diagnostics
        shell: bash
        run: |
          mkdir -p dist/native
          launcher="native/mira-launcher/target/release/mira-launcher"
          sandbox="native/mira-sandbox/target/release/mira-sandbox"
          pack="native/mira-pack/target/release/mira-pack"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            launcher="${launcher}.exe"
            sandbox="${sandbox}.exe"
            pack="${pack}.exe"
          fi
          cp "$launcher" dist/native/
          cp "$sandbox" dist/native/
          cp "$pack" dist/native/

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 libwebkit2gtk-4.1-0

      - name: Build WebUI bundle
        working-directory: webui
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[desktop,dev]

      - name: Build native desktop app
        shell: bash
        run: |
          data_sep=":"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            data_sep=";"
          fi
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --name Mira \
            --windowed \
            --collect-all webview \
            --add-data "mira/web/dist${data_sep}mira/web/dist" \
            --add-data "dist/native${data_sep}native" \
            scripts/mira_desktop.py

      - name: Install macOS packaging tools
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg

      - name: Package installer (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          mkdir -p dmg-root
          cp -R Mira.app dmg-root/Mira.app
          ln -s /Applications dmg-root/Applications
          create-dmg \
            --volname "Mira Installer" \
            --window-pos 200 120 \
            --window-size 840 520 \
            --icon-size 120 \
            --icon "Mira.app" 220 250 \
            --icon "Applications" 620 250 \
            --hide-extension "Mira.app" \
            --app-drop-link 620 250 \
            "Mira.dmg" \
            "dmg-root"

      - name: Sign and notarize macOS release
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          test -n "$MACOS_CERTIFICATE_P12"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          test -n "$MACOS_CODESIGN_IDENTITY"
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          security create-keychain -p "$RUNNER_TEMP/mira.keychain.pass" "$RUNNER_TEMP/mira.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/mira.keychain-db"
          security unlock-keychain -p "$RUNNER_TEMP/mira.keychain.pass" "$RUNNER_TEMP/mira.keychain-db"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/mira-cert.p12"
          security import "$RUNNER_TEMP/mira-cert.p12" -k "$RUNNER_TEMP/mira.keychain-db" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$RUNNER_TEMP/mira.keychain.pass" "$RUNNER_TEMP/mira.keychain-db"
          find dist/native -type f -perm -111 -print0 | xargs -0 -I{} codesign --force --options runtime --timestamp --sign "$MACOS_CODESIGN_IDENTITY" "{}"
          find dist/dmg-root/Mira.app -type f \( -name 'mira-launcher' -o -name 'mira-sandbox' -o -name 'mira-pack' \) -print0 | xargs -0 -I{} codesign --force --options runtime --timestamp --sign "$MACOS_CODESIGN_IDENTITY" "{}"
          codesign --force --deep --options runtime --timestamp --sign "$MACOS_CODESIGN_IDENTITY" dist/dmg-root/Mira.app
          codesign --verify --deep --strict --verbose=2 dist/dmg-root/Mira.app
          cd dist
          rm -f Mira.dmg
          create-dmg --volname "Mira Installer" --window-pos 200 120 --window-size 840 520 --icon-size 120 --icon "Mira.app" 220 250 --icon "Applications" 620 250 --hide-extension "Mira.app" --app-drop-link 620 250 "Mira.dmg" "dmg-root"
          xcrun notarytool submit Mira.dmg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          xcrun stapler staple Mira.dmg
          xcrun stapler validate Mira.dmg
          spctl --assess --type execute --verbose=2 dmg-root/Mira.app
          touch signing-verified.txt

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Write installer script (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @'
          #define MyAppName "Mira"
          #define MyAppVersion GetEnv("MIRA_RELEASE_VERSION")
          #define MyAppPublisher "NSIETeam"
          #define MyAppExeName "Mira.exe"

          [Setup]
          AppId={{8D5FB5A0-4D4B-49BA-8A18-2A3D5C82C5E8}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName={autopf}\{#MyAppName}
          DefaultGroupName={#MyAppName}
          DisableProgramGroupPage=yes
          OutputDir=dist
          OutputBaseFilename=Mira-Setup
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallDisplayIcon={app}\{#MyAppExeName}

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"; Flags: unchecked

          [Files]
          Source: "dist\Mira\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Launch Mira"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content -Path installer.iss -Encoding ascii

      - name: Package installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Sign Windows release
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_PFX) { throw "WINDOWS_CERTIFICATE_PFX is required for tag releases" }
          if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) { throw "WINDOWS_CERTIFICATE_PASSWORD is required for tag releases" }
          $certPath = Join-Path $env:RUNNER_TEMP "mira-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          $signtool = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.26100.0\x64\signtool.exe"
          if (-not (Test-Path $signtool)) { $signtool = "signtool.exe" }
          Get-ChildItem dist\native\*.exe | ForEach-Object {
            & $signtool sign /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
          }
          Get-ChildItem dist\Mira\native\*.exe | ForEach-Object {
            & $signtool sign /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
          }
          & $signtool sign /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\Mira\Mira.exe
          & $signtool sign /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\Mira-Setup.exe
          & $signtool verify /pa /v dist\Mira-Setup.exe
          New-Item -ItemType File -Force -Path dist\signing-verified.txt | Out-Null

      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar -czf Mira-linux.tar.gz Mira

      - name: Audit release package size
        shell: bash
        run: |
          tool="native/mira-pack/target/release/mira-pack"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            tool="${tool}.exe"
            artifact="dist/Mira-Setup.exe"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            artifact="dist/Mira.dmg"
          else
            artifact="dist/Mira-linux.tar.gz"
          fi
          artifact_limit="${MIRA_RELEASE_ARTIFACT_LIMIT_MB:-${MIRA_RELEASE_SIZE_LIMIT_MB:-180}}"
          "$tool" "$artifact" --json --limit-mb "$artifact_limit" > "dist/Mira-pack-${RUNNER_OS}.json"
          cat "dist/Mira-pack-${RUNNER_OS}.json"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            "$tool" "dist/dmg-root/Mira.app" --json --limit-mb "${MIRA_RELEASE_BUNDLE_LIMIT_MB:-119}" > "dist/Mira-bundle-pack-${RUNNER_OS}.json"
          elif [[ -d dist/Mira ]]; then
            "$tool" "dist/Mira" --json --limit-mb "${MIRA_RELEASE_BUNDLE_LIMIT_MB:-119}" > "dist/Mira-bundle-pack-${RUNNER_OS}.json"
          fi
          test -f "dist/Mira-bundle-pack-${RUNNER_OS}.json" && cat "dist/Mira-bundle-pack-${RUNNER_OS}.json"
          trusted="false"
          if [[ "$GITHUB_REF" == refs/tags/v* && -f dist/signing-verified.txt ]]; then
            trusted="true"
          fi
          cat > dist/Mira-trust-${RUNNER_OS}.json <<EOF
          {"artifact":"$artifact","trusted_release":$trusted,"signed_and_verified":$trusted,"artifact_size_limit_mb":$artifact_limit}
          EOF

      - name: Smoke-test packaged app (macOS)
        if: runner.os == 'macOS'
        run: |
          MIRA_DESKTOP_SMOKE=1 dist/dmg-root/Mira.app/Contents/MacOS/Mira
          hdiutil attach dist/Mira.dmg -mountpoint "$RUNNER_TEMP/MiraDmg" -nobrowse -quiet
          test -d "$RUNNER_TEMP/MiraDmg/Mira.app"
          hdiutil detach "$RUNNER_TEMP/MiraDmg" -quiet

      - name: Smoke-test packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MIRA_DESKTOP_SMOKE = "1"
          & dist\Mira\Mira.exe
          Start-Process -FilePath dist\Mira-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$env:RUNNER_TEMP\MiraInstall" -Wait
          & "$env:RUNNER_TEMP\MiraInstall\Mira.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\MiraInstall\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait

      - name: Smoke-test packaged app (Linux)
        if: runner.os == 'Linux'
        run: |
          MIRA_DESKTOP_SMOKE=1 dist/Mira/Mira
          mkdir -p "$RUNNER_TEMP/mira-linux"
          tar -xzf dist/Mira-linux.tar.gz -C "$RUNNER_TEMP/mira-linux"
          MIRA_DESKTOP_SMOKE=1 "$RUNNER_TEMP/mira-linux/Mira/Mira"

      - name: Publish integrity metadata
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          dist = Path("dist")
          rows = []
          for path in sorted(dist.glob("Mira*")):
              if path.is_file() and path.name in {"Mira.dmg", "Mira-Setup.exe", "Mira-linux.tar.gz"}:
                  rows.append(f"{sha256(path.read_bytes()).hexdigest()}  {path.name}")
          (dist / "SHA256SUMS").write_text("\n".join(rows) + ("\n" if rows else ""), encoding="utf-8")
          PY

      - name: Audit package size
        shell: bash
        run: |
          bundle_limit="${MIRA_RELEASE_BUNDLE_LIMIT_MB:-119}"
          if [[ -d dist/Mira.app ]]; then
            python scripts/package_size_report.py dist/Mira.app --budget-mb "$bundle_limit" --fail-on-over-budget
          elif [[ -d dist/Mira ]]; then
            python scripts/package_size_report.py dist/Mira --budget-mb "$bundle_limit" --fail-on-over-budget
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mira-desktop-${{ runner.os }}
          path: |
            dist/Mira.dmg
            dist/Mira-Setup.exe
            dist/Mira-linux.tar.gz
            dist/Mira-pack-*.json
            dist/Mira-bundle-pack-*.json
            dist/Mira-trust-*.json
            dist/SHA256SUMS
            dist/native/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.exe
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.json
            release-artifacts/**/SHA256SUMS
            release-artifacts/**/mira-launcher*
            release-artifacts/**/mira-sandbox*
            release-artifacts/**/mira-pack*
