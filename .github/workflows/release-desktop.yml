name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 libwebkit2gtk-4.1-0

      - name: Build WebUI bundle
        working-directory: webui
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[desktop,dev]

      - name: Build native desktop app
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --name Mira \
            --windowed \
            --collect-all webview \
            scripts/mira_desktop.py

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent Mira.app Mira-macos.zip

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Mira/* -DestinationPath dist/Mira-windows.zip -Force

      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar -czf Mira-linux.tar.gz Mira

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mira-desktop-${{ runner.os }}
          path: |
            dist/Mira-macos.zip
            dist/Mira-windows.zip
            dist/Mira-linux.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.zip
            release-artifacts/**/*.tar.gz
