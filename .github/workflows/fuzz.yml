name: Fuzz Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - mira/agent/**
      - tests/fuzz/**
      - .github/workflows/fuzz.yml

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Hypothesis fuzz tests
        run: uv run --no-sync python -m pytest tests/fuzz -q --hypothesis-show-statistics
